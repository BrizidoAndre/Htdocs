<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../search/search.css">
    <link rel="stylesheet" href="pet.css">
</head>
<body>

<div class="container-background">
    <section class="container-pet">
        <a class="icon-back" href="../search/searchDog.html">
            <img  src="../images/2-preview/chevron-left-white.svg" alt="Pressione para levar o usuário a página de cães">
        </a>

        <img src="../images/2-preview/karsten-big.png" alt="Foto dando ênfase no cão karsten">

        <div class="container-info">
            <div class="box-info">
                <p class="text-property">Age</p>
                <p class="text-value">1 year</p>
            </div>
            <div class="box-info">
                <p class="text-property">Height</p>
                <p class="text-value">5-6</p>
            </div>
            <div class="box-info">
                <p class="text-property">Color</p>
                <p class="text-value">Cream</p>
            </div>
            <div class="box-info">
                <p class="text-property">Gender</p>
                <p class="text-value">Male</p>
            </div>
        </div>
    </section>

    <div class="container-pet-title">
        <h5 class="text-pet-name-big">Karsten</h5>
        <h5 class="text-breed-big">Bulldog</h5>
    </div>


    <div class="container-profile">
        <img src="../images/2-preview/james.png" alt='perfil do james'>

        <div class="container-profile-text">
            <h5 class="text-breed-big">James Baker <br> Los Angeles - USA</h5>
        </div>
    </div>

    <a href="" class="button-lateral" id="right-color">
        <p class="text-button">Take Home</p>
    </a>
</div>

</body>
</html>
