<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../search/search.css">
    <link rel="stylesheet" href="../search/searchCat.css">
    <link rel="stylesheet" href="pet.css">
</head>
<body>

<div class="container-background">
    <section class="container-pet">
        <a class="icon-back" href="../search/searchCat.html">
            <img  src="../images/2-preview/chevron-left-white.svg" alt="Pressione para levar o usuário a página de gatos">
        </a>

        <img src="../images/2-preview/alex-big.png" alt="Foto dando ênfase no cão karsten">

        <div class="container-info">
            <div class="box-info">
                <p class="text-property">Age</p>
                <p class="text-value">1.2 years</p>
            </div>
            <div class="box-info">
                <p class="text-property">Height</p>
                <p class="text-value">3-4</p>
            </div>
            <div class="box-info">
                <p class="text-property">Color</p>
                <p class="text-value">Black</p>
            </div>
            <div class="box-info">
                <p class="text-property">Gender</p>
                <p class="text-value">Male</p>
            </div>
        </div>
    </section>

    <div class="container-pet-title">
        <h5 class="text-pet-name-big">Alex</h5>
        <h5 class="text-breed-big">Siamese</h5>
    </div>


    <div class="container-profile">
        <img src="../images/2-preview/sophie.png" alt='perfil do james'>

        <div class="container-profile-text">
            <h5 class="text-breed-big">Sophie Brooks <br> New York - USA</h5>
        </div>
    </div>

    <a href="" class="button-lateral">
        <p class="text-button">Take Home</p>
    </a>
</div>

</body>
</html>
