<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="Página para visualizar a lista de gatos no abrigo">
    <title>Document</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="search.css">
    <link rel="stylesheet" href="searchCat.css">
</head>
<body>

<div class="container-background">

    <input type="checkbox" id="menu-lateral">

    <header>
        <a class="icon-back" href="../index.html">
            <img src="../images/1-search/chevron-left.svg" alt="Ícone para retornar o usuário para a página Main">
        </a>

        <h2 class="text-title">Search</h2>

        <label for="menu-lateral">
            <img src="../images/1-search/menu-open.svg" alt="botão para abrir o menu lateral">
        </label>
    </header>

    <label for="input-search" class="container-search">
        <img src="../images/1-search/search.svg" alt="Lupa para simbolizar o container como um input para pesquisa">
        <input type="text" id="input-search" class="text-search">
    </label>


    <nav>
        <a href="searchDog.html" class="nav-button">
            <img src="../images/1-search/fa-solid_dog.svg" alt="Container para levar o usuário para a página de cachorros">
            <p class="text-button">Dogs</p>
        </a>

        <a href="" class="nav-button selected">
            <img src="../images/1-search/fa-solid_cat_white.svg" alt="Container para levar o usuário para a página de gatos">
            <p class="text-button selected">Cats</p>
        </a>
    </nav>


    <section class="container-cards">
        <a href="" class="container-card">
            <span class="circle"></span>
            <img class="image-card" src="../images/1-search/cats/ariana.png" alt="Benji um cão da casa de adoção">

            <div class="container-card-bottom">
                <p class="text-pet-name">Ariana</p>
                <p class="text-breed">Graycat</p>
                <img src="../images/1-search/hearthome.svg" alt="icone de casa">
            </div>
        </a>
        <a href="" class="container-card">
            <span class="circle"></span>
            <img class="image-card" src="../images/1-search/cats/remi.png" alt="Alvan um cão da casa de adoção">

            <div class="container-card-bottom">
                <p class="text-pet-name">Remi</p>
                <p class="text-breed">Whitecat</p>
                <img src="../images/1-search/hearthome.svg" alt="icone de casa">
            </div>
        </a>
        <a href="../pet/alex.html" class="container-card">
            <span class="circle"></span>
            <img class="image-card" src="../images/1-search/cats/alex.png" alt="Karsten um cão da casa de adoção">

            <div class="container-card-bottom">
                <p class="text-pet-name">Alex</p>
                <p class="text-breed">Siamese</p>
                <img src="../images/1-search/hearthome.svg" alt="icone de casa">
            </div>
        </a>
        <a href="" class="container-card">
            <span class="circle"></span>
            <img class="image-card" src="../images/1-search/cats/zoe.png" alt="Reigner um cão da casa de adoção">

            <div class="container-card-bottom">
                <p class="text-pet-name">Zoe</p>
                <p class="text-breed">Persian</p>
                <img src="../images/1-search/hearthome.svg" alt="icone de casa">
            </div>
        </a>
    </section>



    <section class="menu-lateral">
        <label for="menu-lateral" class="icon-menu-close">
            <img src="../images/1-search/menu-close.svg" alt="Pressione para fechar o botão lateral">
        </label>
        <h2 class="text-title">Menu</h2>

        <a href="../index.html" class="button-lateral">
            <img src="../images/1-search/fa-solid_home.svg" alt="Pressione para voltar a página home">

            <p class="text-button">Home</p>
        </a>
        <a href="searchDog.html" class="button-lateral">
            <img src="../images/1-search/fa-solid_dog_white.svg" alt="Pressione para voltar a página de cachorros">

            <p class="text-button">Dogs</p>
        </a>
        <a href="searchCat.html" class="button-lateral">
            <img src="../images/1-search/fa-solid_cat_white.svg" alt="Pressione para voltar a página Gatos">

            <p class="text-button">Gatos</p>
        </a>
    </section>

</div>

</body>
</html>
